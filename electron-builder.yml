appId: com.filecompressor.desktop
productName: File Compressor
copyright: Copyright © 2026 Ngọc Huy Dev - Ocean Labs
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,README.MD,PROGRESS.md,HUONG_DAN.md,PROMPT_CHO_AGENT.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,postcss.config.js,tailwind.config.js}'
  - '!*.{tsbuildinfo,patch,zip,log}'
  - '!tests/*'
  - '!docs/*'
  - '!scripts/*'
  - '!local-handoff/*'
  - '!tmp-test/*'
  - '!coverage/*'
  - '!resources/bin/*'
  - '!**/node_modules/ffmpeg-static/**/*'
  - '!**/node_modules/ffprobe-static/**/*'
  - '!**/node_modules/7zip-bin/**/*'
asar: true
asarUnpack:
  - '**/node_modules/sharp/**/*'
  - '**/node_modules/@img/**/*'
extraResources:
  - from: resources/bin/win32-x64
    to: bin
    filter:
      - '**/*'
  - from: resources/notices
    to: notices
    filter:
      - '**/*'
  - from: LICENSE
    to: LICENSE
win:
  executableName: FileCompressor
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  deleteAppDataOnUninstall: false
npmRebuild: false
