name: Build FFmpeg & Export Corresponding Source (Windows x64)

on:
  workflow_dispatch:
    inputs:
      ffmpeg_commit:
        description: 'FFmpeg source commit SHA to build'
        required: true
        default: '1fdbca85aaea513c9cc6c14d347f76543346d3da'
      upload_release_asset:
        description: 'Upload built artifacts to current release if running on a tag'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-win64:
    name: Build FFmpeg win64-gpl and Corresponding Source
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git curl xz-utils zip p7zip-full

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Vendored Build Recipe
        run: |
          test -d third_party/ffmpeg-build-recipe/scripts.d
          test -f third_party/ffmpeg-build-recipe/build.sh
          test -f third_party/ffmpeg-build-recipe/generate.sh
          test -f third_party/ffmpeg-build-recipe/makeimage.sh
          echo "Using vendored FFmpeg build recipe (BtbN/FFmpeg-Builds at commit a99e8230eae00d1cee38f23076a7a1f55cd984e2)"

      - name: Prepare Docker Build Image
        working-directory: third_party/ffmpeg-build-recipe
        run: |
          chmod +x *.sh util/*.sh
          ./makeimage.sh win64 gpl 7.1

      - name: Cross-Compile FFmpeg (win64-gpl-7.1)
        working-directory: third_party/ffmpeg-build-recipe
        env:
          GIT_BRANCH_OVERRIDE: ${{ inputs.ffmpeg_commit }}
        run: |
          ./build.sh win64 gpl 7.1

      - name: Package Binaries and Calculate Checksums
        working-directory: third_party/ffmpeg-build-recipe
        run: |
          mkdir -p ../../dist-ffmpeg
          cp artifacts/*.zip ../../dist-ffmpeg/
          cd ../../dist-ffmpeg
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Package Complete Corresponding Source Archive
        run: |
          mkdir -p dist-ffmpeg-source
          node scripts/bundle-ffmpeg-corresponding-source.mjs --out dist-ffmpeg-source/FileCompressor-FFmpeg-BuildRecipe-and-SourceManifest-1.0.0.zip

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win64-gpl-binaries-and-source
          path: |
            dist-ffmpeg/*
            dist-ffmpeg-source/*
          retention-days: 90
